name: Policy Compliance Check

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================
  # Detect project language first — everything else uses this
  # ============================================================
  detect-language:
    name: Detect Project Language
    runs-on: ubuntu-latest
    outputs:
      is_node:    ${{ steps.detect.outputs.is_node }}
      is_python:  ${{ steps.detect.outputs.is_python }}
      is_go:      ${{ steps.detect.outputs.is_go }}
      is_java:    ${{ steps.detect.outputs.is_java }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect languages
        id: detect
        run: |
          echo "is_node=$([ -f package.json ] && echo true || echo false)"     >> $GITHUB_OUTPUT
          echo "is_python=$([ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f Pipfile ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "is_go=$([ -f go.mod ] && echo true || echo false)"             >> $GITHUB_OUTPUT
          echo "is_java=$([ -f pom.xml ] || [ -f build.gradle ] && echo true || echo false)" >> $GITHUB_OUTPUT

  # ============================================================
  # Rule 6 — Secrets (all languages)
  # ============================================================
  check-secrets:
    name: R06 — Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        id: gitleaks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_REPORT_FORMAT: sarif
          GITLEAKS_REPORT_PATH: gitleaks-report.sarif
        continue-on-error: true
      - name: Save Gitleaks report
        if: always()
        run: |
          mkdir -p .policy-reports
          if [ -f gitleaks-report.sarif ]; then
            cp gitleaks-report.sarif .policy-reports/gitleaks.sarif
            count=$(python3 -c 'import json,sys; d=json.load(open("gitleaks-report.sarif")); print(len(d["runs"][0].get("results",[])))' 2>/dev/null || echo 0)
            echo "Secrets found: $count"
            if [ "$count" -gt "0" ]; then
              echo "FAIL: $count secret(s) detected"
              exit 1
            fi
          fi
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.sha }}
          path: .policy-reports/gitleaks.sarif
          retention-days: 30

  # ============================================================
  # Rule 5 & 21 — SAST Security (all languages)
  # ============================================================
  check-sast:
    name: R05/R21 — SAST Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/secrets
            p/sql-injection
            p/python
            p/javascript
            p/java
            p/golang
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

  # ============================================================
  # Rule 16 — Dependencies (per language)
  # ============================================================
  check-deps-node:
    name: R16 — Dependencies (Node.js)
    runs-on: ubuntu-latest
    needs: detect-language
    if: needs.detect-language.outputs.is_node == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: false
      - name: Check outdated packages
        run: npm outdated || true

  check-deps-python:
    name: R16 — Dependencies (Python)
    runs-on: ubuntu-latest
    needs: detect-language
    if: needs.detect-language.outputs.is_python == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit --quiet
      - name: pip-audit
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --progress-spinner off
          elif [ -f pyproject.toml ]; then
            pip install -e . --quiet || true
            pip-audit --progress-spinner off
          elif [ -f Pipfile ]; then
            pip install pipenv --quiet
            pipenv install --quiet || true
            pip-audit --progress-spinner off
          fi
        continue-on-error: false

  check-deps-go:
    name: R16 — Dependencies (Go)
    runs-on: ubuntu-latest
    needs: detect-language
    if: needs.detect-language.outputs.is_go == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: false

  check-deps-java:
    name: R16 — Dependencies (Java)
    runs-on: ubuntu-latest
    needs: detect-language
    if: needs.detect-language.outputs.is_java == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: OWASP Dependency Check
        run: |
          wget -q https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.7/dependency-check-9.0.7-release.zip
          unzip -q dependency-check-9.0.7-release.zip
          ./dependency-check/bin/dependency-check.sh \
            --project "policy-check" --scan . \
            --format JSON --out dependency-check-report \
            --failOnCVSS 7
        continue-on-error: false

  # ============================================================
  # Rule 3 — Formatting & Linting (per language)
  # ============================================================
  check-lint-node:
    name: R03 — Lint (Node.js / ESLint)
    runs-on: ubuntu-latest
    needs: detect-language
    if: needs.detect-language.outputs.is_node == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: ESLint
        run: npx eslint . --max-warnings=0
        continue-on-error: true

  check-lint-python:
    name: R03 — Lint (Python / Ruff)
    runs-on: ubuntu-latest
    needs: detect-language
    if: needs.detect-language.outputs.is_python == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install ruff --quiet
          if [ -f requirements.txt ]; then pip install -r requirements.txt --quiet || true; fi
          if [ -f pyproject.toml ]; then pip install -e . --quiet || true; fi
          if [ -f Pipfile ]; then pip install pipenv --quiet && pipenv install --quiet || true; fi
      - name: Ruff lint
        run: ruff check . --output-format=github
        continue-on-error: true
      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true

  check-lint-go:
    name: R03 — Lint (Go / golangci-lint)
    runs-on: ubuntu-latest
    needs: detect-language
    if: needs.detect-language.outputs.is_go == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v4
        continue-on-error: true

  check-lint-java:
    name: R03 — Lint (Java / Checkstyle)
    runs-on: ubuntu-latest
    needs: detect-language
    if: needs.detect-language.outputs.is_java == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Checkstyle
        run: |
          if [ -f pom.xml ]; then mvn checkstyle:check -q || true
          elif [ -f build.gradle ]; then ./gradlew checkstyleMain || true
          fi
        continue-on-error: true

  # ============================================================
  # Rule 13 — Tests & Coverage (per language)
  # ============================================================
  check-tests-node:
    name: R13 — Tests & Coverage (Node.js)
    runs-on: ubuntu-latest
    needs: detect-language
    if: needs.detect-language.outputs.is_node == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Jest coverage
        run: |
          npx jest --coverage --coverageReporters=json-summary \
            --passWithNoTests --forceExit
        continue-on-error: true
      - name: Enforce 70% threshold
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            python3 -c "
          import json, sys
          d = json.load(open('coverage/coverage-summary.json'))
          pct = d['total']['lines']['pct']
          print(f'Line coverage: {pct}%')
          sys.exit(0) if pct >= 70 else sys.exit(1)
            "
          else
            echo "No coverage report generated — ensure jest is configured."
          fi
        continue-on-error: true

  check-tests-python:
    name: R13 — Tests & Coverage (Python)
    runs-on: ubuntu-latest
    needs: detect-language
    if: needs.detect-language.outputs.is_python == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pytest pytest-cov --quiet
          if [ -f requirements.txt ]; then pip install -r requirements.txt --quiet || true; fi
          if [ -f pyproject.toml ]; then pip install -e . --quiet || true; fi
          if [ -f Pipfile ]; then pip install pipenv --quiet && pipenv install --quiet || true; fi
      - name: Check test files exist
        run: |
          count=$(find . -name "test_*.py" -o -name "*_test.py" | grep -v ".git" | wc -l)
          echo "Test files found: $count"
          if [ "$count" -eq 0 ]; then
            echo "FAIL: No test files found. Rule 13 requires tests."
            exit 1
          fi
        continue-on-error: true
      - name: pytest with coverage
        run: |
          pytest --cov=. --cov-report=json \
            --cov-fail-under=70 -q 2>/dev/null || true
        continue-on-error: true

  check-tests-go:
    name: R13 — Tests & Coverage (Go)
    runs-on: ubuntu-latest
    needs: detect-language
    if: needs.detect-language.outputs.is_go == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Go test coverage
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1
        continue-on-error: true

  check-tests-java:
    name: R13 — Tests & Coverage (Java)
    runs-on: ubuntu-latest
    needs: detect-language
    if: needs.detect-language.outputs.is_java == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Run tests
        run: |
          if [ -f pom.xml ]; then mvn test -q
          elif [ -f build.gradle ]; then ./gradlew test
          fi
        continue-on-error: true

  # ============================================================
  # Rule 15 — Git / Commit Messages (all languages)
  # ============================================================
  check-git:
    name: R15 — Commit Message Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v5
        continue-on-error: true

  # ============================================================
  # Rule 25 — AI Attribution (all languages, PRs only)
  # ============================================================
  check-ai-attribution:
    name: R25 — AI Attribution in PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR body for AI attribution
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          if echo "$PR_BODY" | grep -qi "ai-generated\|ai-assisted\|vibe cod\|copilot\|chatgpt\|claude\|kiro"; then
            echo "✔ AI attribution found in PR description."
          else
            echo "WARN: No AI attribution noted. If AI tools were used, add a note per Rule 25."
          fi

  # ============================================================
  # Generate Report — runs after ALL checks, always
  # ============================================================
  generate-report:
    name: Generate Policy Report
    runs-on: ubuntu-latest
    needs:
      - check-secrets
      - check-sast
      - check-git
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Setup policy scripts
        run: |
          chmod +x .policy-system/scripts/*.sh

      - name: Run full policy scan
        continue-on-error: true
        run: |
          mkdir -p .policy-reports
          bash .policy-system/scripts/run-checks.sh \
            "${{ github.repository }}" "${{ github.workspace }}"

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-report-${{ github.sha }}
          path: .policy-reports/
          retention-days: 30

      - name: Post score to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            let files = [];
            try {
              files = fs.readdirSync('.policy-reports')
                .filter(f => f.startsWith('results_') && f.endsWith('.json'));
            } catch(e) { return; }
            if (!files.length) return;

            const data = JSON.parse(
              fs.readFileSync(`.policy-reports/${files.sort().pop()}`)
            );
            const s = data.summary;
            const score = Math.round(s.pass / Math.max(s.pass + s.fail + s.warn, 1) * 100);
            const icon = score >= 80 ? '🟢' : score >= 60 ? '🟡' : '🔴';

            const body = [
              `## ${icon} Policy Compliance Report — ${score}%`,
              ``,
              `| Check | Count |`,
              `|---|---|`,
              `| ✔ Pass | ${s.pass} |`,
              `| ✘ Fail | ${s.fail} |`,
              `| ⚠ Warn | ${s.warn} |`,
              `| – Skip | ${s.skip} |`,
              ``,
              `> Download the full HTML report from the **Artifacts** section of this run.`,
              `> Policy: Software Development Policy v1.2 — 25 Rules`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
